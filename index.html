<title>趕魚</title>

<style>

    --ink: #16120d;
    --ink-mid: #6b6058;
    --ink-light: #b5a99a;
    --ink-faint: #d4ccbf;
    --serif: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;

  body {

  }

<body>

<header>
  <h1 class="title-zh">趕魚</h1>
  <div class="title-rule"></div>
  <p class="title-en">pond · fish · simulation</p>
</header>

<main>
  <div class="pond-wrap">
    <canvas id="c" width="2812" height="1291"></canvas>
  </div>
</main>

<footer>
  <div class="note-col">
    <span class="note-label">魚群行為</span>
    <p class="note-text">三百隻小魚以金魚輪廓為初始形態。靜態時緩慢游動，受驚後逃散，漸漸歸位重組。恐懼從個體向鄰近魚群傳遞，形成連鎖反應。</p>
  </div>
  <div class="note-col">
    <span class="note-label">物理設計</span>
    <p class="note-text">每隻魚具備速度、方向、深度層次與個別回家彈力。閒置慢速漫遊，遭遇掠食者時急速逃竄，阻尼衰減後彈力引導歸位。</p>
  </div>
  <div class="note-col">
    <span class="note-label">視覺美學</span>
    <p class="note-text">水墨宣紙為基調，魚以俯視剪影呈現，深淺透明度模擬水中深度。尾鰭依速度動態擺動，水面留下擴散漣漪。</p>
  </div>
  <div class="credit">
    <span>LNPRJ02 · 2026</span>
    <span>移動滑鼠扮演掠食者</span>
  </div>
</footer>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

const N=300, SEP_R=18, FEAR_R=58, FLEE_R=112, CELL=80;
const IDLE=.32, FMAX=5.8, DAMP=.972, FD=.93, FORCE=13, HK=.0042;

let W, H, dpr, fish=[], pads=[], grid={};
let mouse={x:-999, y:-999, on:false};
let rings=[], curT=0, lastRx=-999, lastRy=-999;

function inGF(x, y, cx, cy, sc) {
  let dx, dy;
  dx=(x-cx)/sc; dy=(y-cy)/(sc*.62);
  if(dx*dx+dy*dy<1) return true;
  const tx=cx-sc*1.18;
  dx=(x-tx)/(sc*.46); dy=(y-(cy-sc*.4))/(sc*.5);
  if(dx*dx+dy*dy<1) return true;
  dx=(x-tx)/(sc*.46); dy=(y-(cy+sc*.4))/(sc*.5);
  return dx*dx+dy*dy<1;
}

function sampleGF(cx, cy, sc) {
  const x0=cx-sc*1.68, x1=cx+sc, y0=cy-sc*.92, y1=cy+sc*.92;
  let x, y, n=0;
  do {
    x=x0+Math.random()*(x1-x0);
    y=y0+Math.random()*(y1-y0);
    n++;
  } while(!inGF(x,y,cx,cy,sc) && n<300);
  return [x, y];
}

function resize() {
  const r = cvs.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cvs.width = r.width * dpr;
  cvs.height = r.height * dpr;
  W = r.width; H = r.height;
  build();
}

function build() {
  fish = [];
  const sc = Math.min(W, H) * .2;
  const cx = W * .53, cy = H * .5;
  for(let i=0; i<N; i++) {
    const [hx, hy] = sampleGF(cx, cy, sc);
    const a = Math.random() * Math.PI * 2;
    fish.push({
      x: hx+(Math.random()-.5)*3, y: hy+(Math.random()-.5)*3,
      hx, hy, vx: Math.cos(a)*.18, vy: Math.sin(a)*.18,
      wa: a, wt: Math.random()*50,
      fear: 0, lastA: a, phase: Math.random()*Math.PI*2,
      sz: .82+Math.random()*.92, dep: Math.random(),
      red: Math.random()<.13
    });
  }
  pads = [
    {rx:.09, ry:.15, r:34, rot:.6,  seed:1.2},
    {rx:.87, ry:.1,  r:26, rot:2.2, seed:2.8},
    {rx:.8,  ry:.83, r:40, rot:1.3, seed:.5},
    {rx:.16, ry:.86, r:30, rot:2.7, seed:3.1},
    {rx:.52, ry:.46, r:24, rot:.4,  seed:1.8},
    {rx:.36, ry:.1,  r:20, rot:1.7, seed:4.2},
  ];
}

function buildGrid() {
  grid = {};
  for(const f of fish) {
    const k = `${Math.floor(f.x/CELL)},${Math.floor(f.y/CELL)}`;
    if(!grid[k]) grid[k] = [];
    grid[k].push(f);
  }
}

function nearby(f, r) {
  const cr=Math.ceil(r/CELL)+1, cx=Math.floor(f.x/CELL), cy=Math.floor(f.y/CELL), res=[];
  for(let dx=-cr; dx<=cr; dx++) for(let dy=-cr; dy<=cr; dy++) {
    const c = grid[`${cx+dx},${cy+dy}`];
    if(c) for(const g of c) if(g!==f) res.push(g);
  }
  return res;
}

function drawPad(p) {
  const x=p.rx*W, y=p.ry*H, r=p.r, seed=p.seed;
  ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot);
  const gap=.38, startA=gap/2, nSegs=28, span=Math.PI*2-gap, pts=[];
  for(let i=0; i<=nSegs; i++) {
    const t=i/nSegs, a=startA+t*span, rv=r*(.88+.12*Math.sin(seed+a*5.3));
    pts.push([Math.cos(a)*rv, Math.sin(a)*rv]);
  }
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(pts[0][0], pts[0][1]);
  for(let i=0; i<pts.length-1; i++) {
    const p0=pts[i], p1=pts[i+1];
    ctx.quadraticCurveTo(p0[0],p0[1], (p0[0]+p1[0])/2, (p0[1]+p1[1])/2);
  }
  ctx.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
  ctx.lineTo(0,0); ctx.closePath();
  ctx.fillStyle='rgba(72,102,65,.15)'; ctx.fill();
  ctx.strokeStyle='rgba(52,82,45,.38)'; ctx.lineWidth=.9; ctx.stroke();
  ctx.strokeStyle='rgba(52,82,45,.22)'; ctx.lineWidth=.5;
  const midA = startA+span*.5;
  for(let i=-4; i<=4; i++) {
    const va=midA+i*.18, vr=r*(.55+Math.abs(i)*.018);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(va)*vr, Math.sin(va)*vr); ctx.stroke();
  }
  ctx.restore();
}

function drawFish(f) {
  const spd = Math.sqrt(f.vx*f.vx + f.vy*f.vy);
  f.phase += .055 + spd*.16;
  const wag = Math.sin(f.phase) * (.16 + spd*.1);
  const L=f.sz*9, BW=f.sz*2.9, sf=1-f.dep;
  const al = sf*.52+.18+f.fear*.12;
  const af = (al*.62).toFixed(3);
  const am = Math.min(.96, al).toFixed(3);
  let r1, g1, b1;
  if(f.red) { r1=160+Math.round(sf*18); g1=48+Math.round(sf*10); b1=26; }
  else { const v=24+Math.round(sf*14); r1=v+4; g1=v+1; b1=v-3; }
  const cM=`rgba(${r1},${g1},${b1},${am})`;
  const cF=`rgba(${r1},${g1},${b1},${af})`;
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.lastA);
  ctx.beginPath(); ctx.moveTo(L*.18, BW*.42);
  ctx.bezierCurveTo(L*.06,BW*1.6, -L*.12,BW*1.45, -L*.22,BW*.68);
  ctx.closePath(); ctx.fillStyle=cF; ctx.fill();
  ctx.beginPath(); ctx.moveTo(L*.26, -BW*.85);
  ctx.bezierCurveTo(L*.1,-BW*2.0, -L*.18,-BW*1.8, -L*.34,-BW*.85);
  ctx.closePath(); ctx.fillStyle=cF; ctx.fill();
  ctx.beginPath(); ctx.moveTo(L*.9, 0);
  ctx.bezierCurveTo(L*.66,-BW*1.12, -L*.14,-BW*1.02, -L*.72,-BW*.16);
  ctx.bezierCurveTo(-L*.14,BW*1.02, L*.66,BW*1.12, L*.9,0);
  ctx.fillStyle=cM; ctx.fill();
  ctx.save(); ctx.translate(-L*.7, 0); ctx.rotate(wag);
  ctx.beginPath(); ctx.moveTo(0,-BW*.13);
  ctx.bezierCurveTo(-L*.22,-BW*1.02,-L*.55,-BW*1.18,-L*.66,-BW*.56);
  ctx.bezierCurveTo(-L*.44,-BW*.3,-L*.16,-BW*.08,0,BW*.06);
  ctx.closePath(); ctx.fillStyle=cF; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, BW*.13);
  ctx.bezierCurveTo(-L*.22,BW*1.02,-L*.55,BW*1.18,-L*.66,BW*.56);
  ctx.bezierCurveTo(-L*.44,BW*.3,-L*.16,BW*.08,0,-BW*.06);
  ctx.closePath(); ctx.fillStyle=cF; ctx.fill();
  ctx.restore(); ctx.restore();
}

function tick() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#f4f1eb'; ctx.fillRect(0,0,W,H);

  // Water shimmer
  const t = Date.now() * .00018;
  ctx.strokeStyle='rgba(0,0,0,.028)'; ctx.lineWidth=.5;
  for(let y=22; y<H; y+=30) {
    ctx.beginPath(); ctx.moveTo(0, y+Math.sin(y*.045+t)*2.2);
    for(let x=0; x<=W; x+=W*.25) ctx.lineTo(x, y+Math.sin(x*.01+y*.04+t)*2.8);
    ctx.stroke();
  }

  for(const p of pads) drawPad(p);

  buildGrid();
  const mx=mouse.x, my=mouse.y;

  for(const f of fish) {
    let nf = 0;
    for(const g of nearby(f, FEAR_R)) nf = Math.max(nf, g.fear*.24);
    f.fear = Math.min(1, f.fear+nf);

    if(mouse.on) {
      const dx=f.x-mx, dy=f.y-my, d2=dx*dx+dy*dy;
      if(d2 < FLEE_R*FLEE_R) {
        const d=Math.sqrt(d2)||.001, tv=1-d/FLEE_R;
        f.vx += (dx/d)*tv*tv*FORCE;
        f.vy += (dy/d)*tv*tv*FORCE;
        f.fear = Math.min(1, f.fear+tv*.75);
      }
    }

    for(const g of nearby(f, SEP_R)) {
      const dx=f.x-g.x, dy=f.y-g.y, d2=dx*dx+dy*dy;
      if(d2<SEP_R*SEP_R && d2>.001) {
        const d=Math.sqrt(d2), push=(1-d/SEP_R)*.42;
        f.vx += (dx/d)*push; f.vy += (dy/d)*push;
      }
    }

    if(--f.wt<=0) { f.wa += (Math.random()-.5)*1.5; f.wt=20+Math.random()*55; }
    const idle = (1-f.fear*.8)*.07;
    f.vx += Math.cos(f.wa)*idle; f.vy += Math.sin(f.wa)*idle;

    // Home spring
    f.vx += (f.hx-f.x)*HK; f.vy += (f.hy-f.y)*HK;

    const spd = Math.sqrt(f.vx*f.vx+f.vy*f.vy);
    const ms = IDLE+(FMAX-IDLE)*f.fear;
    if(spd>ms) { f.vx=(f.vx/spd)*ms; f.vy=(f.vy/spd)*ms; }

    f.vx *= DAMP; f.vy *= DAMP;
    f.x += f.vx; f.y += f.vy;
    f.x = Math.max(5, Math.min(W-5, f.x));
    f.y = Math.max(5, Math.min(H-5, f.y));
    if(spd>.06) f.lastA = Math.atan2(f.vy, f.vx);
    f.fear *= FD;
  }

  fish.sort((a,b) => b.dep-a.dep);
  for(const f of fish) drawFish(f);

  for(let i=rings.length-1; i>=0; i--) {
    const rp=rings[i]; rp.r+=1.6; rp.a*=.95;
    if(rp.a<.01) { rings.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(0,0,0,${rp.a.toFixed(3)})`;
    ctx.lineWidth=(1-rp.r/rp.max)*1.2; ctx.stroke();
  }

  if(mouse.on) {
    curT += .022;
    for(let i=0; i<3; i++) {
      const ph=(curT+i/3)%1, rr=8+ph*52, aa=(1-ph)*.4, lw=(1-ph)*1.5;
      ctx.beginPath(); ctx.arc(mx,my,rr,0,Math.PI*2);
      ctx.strokeStyle=`rgba(18,14,10,${aa.toFixed(3)})`; ctx.lineWidth=lw; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(mx,my,4,0,Math.PI*2);
    ctx.fillStyle='rgba(16,12,8,.8)'; ctx.fill();
    ctx.beginPath(); ctx.arc(mx,my,1.8,0,Math.PI*2);
    ctx.fillStyle='rgba(238,232,224,.9)'; ctx.fill();
  }

  requestAnimationFrame(tick);
}

cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; mouse.on=true;
  const dx=mouse.x-lastRx, dy=mouse.y-lastRy;
  if(dx*dx+dy*dy>400) { rings.push({x:mouse.x,y:mouse.y,r:3,max:62,a:.42}); lastRx=mouse.x; lastRy=mouse.y; }
});
cvs.addEventListener('mouseleave', () => { mouse.on=false; });
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  const r=cvs.getBoundingClientRect();
  mouse.x=e.touches[0].clientX-r.left; mouse.y=e.touches[0].clientY-r.top; mouse.on=true;
}, { passive:false });
cvs.addEventListener('touchend', () => { mouse.on=false; });
window.addEventListener('resize', resize);
resize(); tick();
</script>
